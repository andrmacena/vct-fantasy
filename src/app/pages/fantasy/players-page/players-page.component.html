<div class="uk-container">
    <nav class="uk-navbar-container uk-margin-small-top uk-margin-small-bottom" uk-navbar>
        <div class="uk-navbar-center">
            <ul class="uk-navbar-nav">
                <li class="uk-active">Filtro aqui</li>
            </ul>
        </div>
    </nav>
</div>
<div class="uk-container">
    <div uk-grid >
        <div class="uk-width-1-4" *ngFor="let player of players | async">
            <div class="uk-card uk-card-muted" >
                <div class="uk-card-media-top">
                    <br>
                    <p class="uk-text-center"><img src="{{player.urlProfile}}" class="uk-border-circle" alt=""/></p>
                </div>
            </div>
            <div class="uk-card-body uk-padding-remove">
                <h3 class="uk-card-title uk-text-center">{{player.nick}}</h3>
                <p class="uk-text-center">Pontuação geral última semana: {{player.score}}</p>
            </div>
        </div>
    </div>
</div>
