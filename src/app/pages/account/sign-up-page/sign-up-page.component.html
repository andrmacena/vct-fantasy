<div class="vct-wrapper">

  <!-- Brand -->
  <div class="vct-brand">
    <div class="vct-crosshair">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="18" stroke="#FF4655" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.4"/>
        <line x1="24" y1="4"  x2="24" y2="13" stroke="#FF4655" stroke-width="2" stroke-linecap="square"/>
        <line x1="24" y1="35" x2="24" y2="44" stroke="#FF4655" stroke-width="2" stroke-linecap="square"/>
        <line x1="4"  y1="24" x2="13"  y2="24" stroke="#FF4655" stroke-width="2" stroke-linecap="square"/>
        <line x1="35" y1="24" x2="44"  y2="24" stroke="#FF4655" stroke-width="2" stroke-linecap="square"/>
        <circle cx="24" cy="24" r="2" fill="#FF4655"/>
        <line x1="9"  y1="9"  x2="13" y2="9"  stroke="#FF4655" stroke-width="0.8" opacity="0.5"/>
        <line x1="9"  y1="9"  x2="9"  y2="13" stroke="#FF4655" stroke-width="0.8" opacity="0.5"/>
        <line x1="39" y1="9"  x2="35" y2="9"  stroke="#FF4655" stroke-width="0.8" opacity="0.5"/>
        <line x1="39" y1="9"  x2="39" y2="13" stroke="#FF4655" stroke-width="0.8" opacity="0.5"/>
        <line x1="9"  y1="39" x2="13" y2="39" stroke="#FF4655" stroke-width="0.8" opacity="0.5"/>
        <line x1="9"  y1="39" x2="9"  y2="35" stroke="#FF4655" stroke-width="0.8" opacity="0.5"/>
        <line x1="39" y1="39" x2="35" y2="39" stroke="#FF4655" stroke-width="0.8" opacity="0.5"/>
        <line x1="39" y1="39" x2="39" y2="35" stroke="#FF4655" stroke-width="0.8" opacity="0.5"/>
      </svg>
    </div>
    <div class="vct-brand-name">VCT <span>Fantasy</span></div>
    <div class="vct-brand-sub">Monte seu time — domine o campeonato</div>
  </div>

  <!-- Card -->
  <div class="vct-card">

    <div class="vct-card-title">Criar conta</div>

    <!-- Email -->
    <div class="vct-field">
      <label class="vct-label" for="vct-email">E-mail</label>
      <div class="vct-input-wrap uk-inline uk-width-1-1">
        <span class="uk-form-icon" uk-icon="icon: mail; ratio: 0.85"></span>
        <input
          #email
          id="vct-email"
          class="uk-input vct-input uk-width-1-1"
          type="email"
          placeholder="seu@email.com"
          autocomplete="email"
        />
      </div>
    </div>

    <!-- Senha -->
    <div class="vct-field">
      <label class="vct-label" for="vct-password">Senha</label>
      <div class="vct-input-wrap uk-inline uk-width-1-1">
        <span class="uk-form-icon" uk-icon="icon: lock; ratio: 0.85"></span>
        <input
          #password
          id="vct-password"
          class="uk-input vct-input uk-width-1-1"
          type="password"
          placeholder="••••••••"
          autocomplete="new-password"
        />
      </div>
      <p class="vct-field-hint">Mínimo de 8 caracteres.</p>
    </div>

    <!-- Cadastrar -->
    <button
      class="vct-btn-primary"
      (click)="signUp(email.value, password.value)"
    >
      Criar minha conta
    </button>

    <!-- Divider -->
    <div class="vct-divider">
      <span class="vct-divider-text">já tem uma conta?</span>
    </div>

    <!-- Voltar para o login -->
    <a href="/login" class="vct-btn-outline">Entrar</a>

  </div>

  <p class="vct-footer">VCT Fantasy &nbsp;·&nbsp; Não oficial &nbsp;·&nbsp; Baseado no VALORANT Champions Tour</p>

</div>
